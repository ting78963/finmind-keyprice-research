<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinMind Key Price Research V3</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f4f6f8;margin:0;color:#17202a}
.wrap{max-width:720px;margin:auto;padding:28px 16px}.card{background:white;padding:22px;border-radius:18px;border:1px solid #e5e7eb}
h1{margin:0 0 8px}.sub{color:#64748b;margin-bottom:20px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button,a.dl{width:100%;box-sizing:border-box;padding:14px;border-radius:11px;font-size:16px;font-weight:800;border:0;text-align:center;text-decoration:none;display:block}
#start{background:#2563eb;color:white}#stop{display:none;margin-top:9px;background:white;color:#b91c1c;border:1px solid #fecaca}
.status{display:none;margin-top:18px}.bar{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#18794e;width:0}
.row{display:flex;justify-content:space-between;margin-bottom:8px;gap:10px}.note{margin-top:16px;background:#f8fafc;padding:13px;border-radius:12px;color:#475569;line-height:1.6;font-size:14px}
a.dl{background:#18794e;color:white;margin-top:12px}@media(max-width:550px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap"><h1>FinMind Key Price Research V3</h1>
<div class="sub">先用「漲幅＋成交量」砍掉雜訊，再抓候選股當日 1 分 K。</div>
<div class="card"><div class="grid">
<div><label>開始日期</label><input id="sd" type="date" value="2026-08-14"></div>
<div><label>結束日期</label><input id="ed" type="date" value="2026-08-14"></div>
<div><label>最低日內最高漲幅 (%)</label><input id="pctin" type="number" step=".5" value="4"></div>
<div><label>最低當日總成交量（張）</label><input id="lots" type="number" step="500" value="4000"></div>
<div class="full"><button id="start" onclick="go()">開始抓資料</button><button id="stop" onclick="cancel()">停止抓資料</button></div>
</div>
<div class="note"><b>預設候選：</b>當日最高漲幅 ≥ 4% 且當日總成交量 ≥ 4,000 張。只有通過者才抓 1 分 K。關閉頁面或失聯約 20 秒後，後端自動停止。</div>
<div id="status" class="status"><div class="row"><span id="msg">準備中</span><b id="pc">0%</b></div><div class="bar"><div id="fill" class="fill"></div></div><div id="result"></div></div>
</div></div>
<script>
let jid=null,pt=null,ht=null;
async function go(){
 document.getElementById("start").disabled=true; document.getElementById("status").style.display="block";document.getElementById("result").innerHTML="";
 try{
  let r=await fetch("/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({start:sd.value,end:ed.value,screen_pct:+pctin.value,min_lots:+lots.value})});
  let d=await r.json(); if(!r.ok)throw Error(d.error||"啟動失敗"); jid=d.job_id;stop.style.display="block";
  ht=setInterval(()=>fetch("/heartbeat/"+jid,{method:"POST"}).catch(()=>{}),5000); poll();
 }catch(e){msg.textContent=e.message;document.getElementById("start").disabled=false}
}
async function poll(){
 try{
  let r=await fetch("/status/"+jid),d=await r.json(),p=Math.round(d.progress||0);pc.textContent=p+"%";fill.style.width=p+"%";msg.textContent=d.message||"";
  if(d.status==="done"){finish();result.innerHTML='<a class="dl" href="'+d.download+'">下載研究資料 ZIP</a>';return}
  if(d.status==="error"||d.status==="cancelled"){finish();return}
 }catch(e){msg.textContent="連線暫時中斷："+e.message}
 pt=setTimeout(poll,1800);
}
async function cancel(){if(jid)fetch("/cancel/"+jid,{method:"POST"}).catch(()=>{});clearInterval(ht)}
function finish(){clearInterval(ht);clearTimeout(pt);document.getElementById("start").disabled=false;stop.style.display="none"}
addEventListener("pagehide",()=>{if(jid)navigator.sendBeacon("/cancel/"+jid,new Blob([]));clearInterval(ht)});
</script></body></html>
