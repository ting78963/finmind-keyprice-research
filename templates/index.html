<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinMind Key Price Research V3.1</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f4f6f8;margin:0;color:#17202a}
.wrap{max-width:720px;margin:auto;padding:28px 16px}
.card{background:white;padding:22px;border-radius:18px;border:1px solid #e5e7eb}
h1{margin:0 0 8px}.sub{color:#64748b;margin-bottom:20px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button,a.dl{width:100%;box-sizing:border-box;padding:14px;border-radius:11px;font-size:16px;font-weight:800;border:0;text-align:center;text-decoration:none;display:block}
#startBtn{background:#2563eb;color:white}
#stopBtn{display:none;margin-top:9px;background:white;color:#b91c1c;border:1px solid #fecaca}
.status{display:none;margin-top:18px}
.bar{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.fill{height:100%;background:#18794e;width:0}
.row{display:flex;justify-content:space-between;margin-bottom:8px;gap:10px}
.note{margin-top:16px;background:#f8fafc;padding:13px;border-radius:12px;color:#475569;line-height:1.6;font-size:14px}
a.dl{background:#18794e;color:white;margin-top:12px}
.err{color:#b91c1c}
@media(max-width:550px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<h1>FinMind Key Price Research V3.1</h1>
<div class="sub">先用「漲幅＋成交量」砍掉雜訊，再抓候選股當日 1 分 K。</div>

<div class="card">
<div class="grid">
<div>
<label>開始日期</label>
<input id="startDate" type="date" value="2026-08-14">
</div>
<div>
<label>結束日期</label>
<input id="endDate" type="date" value="2026-08-14">
</div>
<div>
<label>最低日內最高漲幅 (%)</label>
<input id="screenPct" type="number" step=".5" value="4">
</div>
<div>
<label>最低當日總成交量（張）</label>
<input id="minLots" type="number" step="500" value="4000">
</div>
<div class="full">
<button id="startBtn" onclick="startJob()">開始抓資料</button>
<button id="stopBtn" onclick="cancelJob()">停止抓資料</button>
</div>
</div>

<div class="note">
<b>預設候選：</b>當日最高漲幅 ≥ 4% 且當日總成交量 ≥ 4,000 張。
只有通過者才抓 1 分 K。關閉頁面或失聯約 20 秒後，後端自動停止。
</div>

<div id="statusBox" class="status">
<div class="row">
<span id="message">準備中</span>
<b id="percent">0%</b>
</div>
<div class="bar"><div id="progressFill" class="fill"></div></div>
<div id="result"></div>
</div>
</div>
</div>

<script>
let jobId = null;
let pollTimer = null;
let heartbeatTimer = null;

function el(id){
  return document.getElementById(id);
}

async function startJob(){
  el("startBtn").disabled = true;
  el("statusBox").style.display = "block";
  el("result").innerHTML = "";
  el("message").textContent = "準備中…";
  el("percent").textContent = "0%";
  el("progressFill").style.width = "0%";

  const payload = {
    start: el("startDate").value,
    end: el("endDate").value,
    screen_pct: Number(el("screenPct").value),
    min_lots: Number(el("minLots").value)
  };

  try{
    const r = await fetch("/start", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const text = await r.text();
    let data;
    try{
      data = JSON.parse(text);
    }catch{
      throw new Error("伺服器回傳格式錯誤，請查看 Render Logs");
    }

    if(!r.ok){
      throw new Error(data.error || "啟動失敗");
    }

    jobId = data.job_id;
    el("stopBtn").style.display = "block";
    startHeartbeat();
    pollStatus();

  }catch(e){
    el("message").innerHTML = '<span class="err">' + e.message + '</span>';
    el("startBtn").disabled = false;
  }
}

function startHeartbeat(){
  stopHeartbeat();

  heartbeatTimer = setInterval(async ()=>{
    if(!jobId) return;
    try{
      await fetch("/heartbeat/" + jobId, {method:"POST"});
    }catch(e){}
  }, 5000);
}

function stopHeartbeat(){
  if(heartbeatTimer){
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
  }
}

async function pollStatus(){
  if(!jobId) return;

  try{
    const r = await fetch("/status/" + jobId);
    const text = await r.text();

    let data;
    try{
      data = JSON.parse(text);
    }catch{
      throw new Error("狀態回傳格式錯誤");
    }

    const p = Math.round(Number(data.progress || 0));

    el("percent").textContent = p + "%";
    el("progressFill").style.width = p + "%";
    el("message").textContent = data.message || "";

    if(data.status === "done"){
      finishJob();
      el("result").innerHTML =
        '<a class="dl" href="' + data.download + '">下載研究資料 ZIP</a>';
      return;
    }

    if(data.status === "error"){
      finishJob();
      el("message").innerHTML =
        '<span class="err">' + (data.message || "發生錯誤") + '</span>';
      return;
    }

    if(data.status === "cancelled"){
      finishJob();
      el("message").textContent = data.message || "工作已停止";
      return;
    }

  }catch(e){
    el("message").innerHTML =
      '<span class="err">連線暫時中斷：' + e.message + '</span>';
  }

  pollTimer = setTimeout(pollStatus, 1800);
}

async function cancelJob(){
  if(!jobId) return;

  el("stopBtn").disabled = true;
  el("message").textContent = "正在停止…";

  try{
    await fetch("/cancel/" + jobId, {method:"POST"});
  }catch(e){}

  stopHeartbeat();
}

function finishJob(){
  stopHeartbeat();

  if(pollTimer){
    clearTimeout(pollTimer);
    pollTimer = null;
  }

  el("startBtn").disabled = false;
  el("stopBtn").style.display = "none";
  el("stopBtn").disabled = false;
  jobId = null;
}

window.addEventListener("pagehide", ()=>{
  if(jobId){
    try{
      navigator.sendBeacon(
        "/cancel/" + jobId,
        new Blob([], {type:"text/plain"})
      );
    }catch(e){}
  }
  stopHeartbeat();
});
</script>
</body>
</html>
